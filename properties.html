<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Havenly UK property search results demo."><title>Search properties | Havenly</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="components.css"></head><body><a class="skip-link" href="#main">Skip to content</a><header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html"><span class="brand-mark">H</span><span>havenly<span class="brand-dot">.</span></span></a><nav class="nav" aria-label="Primary"><a class="active" href="properties.html">Buy</a><a href="properties.html?mode=rent">Rent</a><a href="properties.html?mode=new">New homes</a><a href="index.html#insights">Insights</a><a href="agent.html">For agents</a></nav><div class="nav-actions"><a class="ghost-btn" href="account.html">♡ <span>Saved</span></a><a class="outline-btn" href="account.html">Sign in</a></div></div></header><main id="main"><section class="results-hero"><div class="container"><p class="eyebrow">PROPERTY SEARCH</p><h1>Find a home with the facts upfront.</h1><div class="results-search"><label>Location<input id="q" placeholder="Town, city or postcode"></label><label>Min price<select id="min"><option value="0">Any</option><option value="250000">£250k</option><option value="350000">£350k</option><option value="450000">£450k</option></select></label><label>Max price<select id="max"><option value="9999999">Any</option><option value="500000">£500k</option><option value="750000">£750k</option><option value="1000000">£1m</option></select></label><label>Beds<select id="beds"><option value="0">Any</option><option value="2">2+</option><option value="3">3+</option><option value="4">4+</option></select></label><button class="search-btn" id="go">Search →</button></div><div class="filter-row"><button class="filter active">Verified information</button><button class="filter">Garden</button><button class="filter">Parking</button><button class="filter">EPC B+</button><button class="filter">Freehold</button></div></div></section><section class="section"><div class="container"><div class="results-layout"><aside class="map-panel" aria-label="Map preview"><div class="map-grid"></div><span class="map-pin p1">£475k</span><span class="map-pin p2">£385k</span><span class="map-pin p3">£510k</span><div class="map-label">Interactive map preview</div></aside><div><div class="result-head"><div><p class="eyebrow">MATCHING HOMES</p><h2 id="count">6 properties</h2></div><select id="sort" aria-label="Sort results"><option>Recommended</option><option>Newest</option><option>Lowest price</option><option>Highest price</option></select></div><div class="property-grid" id="grid"></div></div></div></div></section></main><footer class="footer"><div class="container footer-bottom"><span>© 2026 Havenly demo</span><a href="accessibility.html">Accessibility</a><a href="privacy.html">Privacy</a></div></footer><script src="data.js"></script><script>const data=window.HAVENLY_PROPERTIES||[];const grid=document.getElementById('grid');const pound=n=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP',maximumFractionDigits:0}).format(n);function draw(list){document.getElementById('count').textContent=`${list.length} ${list.length===1?'property':'properties'}`;grid.innerHTML=list.map(p=>`<article class="property-card" tabindex="0" data-id="${p.id}"><div class="property-image"><img src="${p.image}" alt="${p.title} in ${p.location}" loading="lazy"><span class="tag">${p.tag}</span><button class="save" type="button" aria-label="Save property">♡</button></div><div class="property-info"><div class="price-row"><span class="price">${pound(p.price)}</span><span class="status">${p.status}</span></div><div class="property-title">${p.title}</div><div class="property-meta">${p.location}</div><div class="property-facts"><span>🛏 ${p.beds}</span><span>◫ ${p.baths}</span><span>↗ ${p.area}</span><span>⚡ ${p.epc}</span></div></div></article>`).join('')||'<div class="empty-state"><h3>No homes match</h3><p>Try widening your search.</p></div>';document.querySelectorAll('.property-card').forEach(c=>c.onclick=e=>{if(!e.target.closest('.save'))location.href=`property.html?id=${c.dataset.id}`})}function run(){const q=document.getElementById('q').value.toLowerCase();const min=+document.getElementById('min').value,max=+document.getElementById('max').value,b=+document.getElementById('beds').value;let list=data.filter(p=>(!q||`${p.location} ${p.title}`.toLowerCase().includes(q))&&p.price>=min&&p.price<=max&&p.beds>=b);const s=document.getElementById('sort').value;if(s==='Lowest price')list.sort((a,b)=>a.price-b.price);if(s==='Highest price')list.sort((a,b)=>b.price-a.price);if(s==='Newest')list=[...list].reverse();draw(list)}document.getElementById('go').onclick=run;document.getElementById('sort').onchange=run;draw(data);</script></body></html>
