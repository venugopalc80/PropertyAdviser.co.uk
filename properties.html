<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Havenly UK property search and comparison demo."><title>Search properties | Havenly</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="components.css"></head><body><a class="skip-link" href="#main">Skip to content</a><header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html"><span class="brand-mark">H</span><span>havenly<span class="brand-dot">.</span></span></a><nav class="nav" aria-label="Primary"><a class="active" href="properties.html">Buy</a><a href="properties.html?mode=rent">Rent</a><a href="properties.html?mode=new">New homes</a><a href="index.html#insights">Insights</a><a href="agent.html">For agents</a></nav><div class="nav-actions"><a class="ghost-btn" href="account.html">♡ <span>Saved</span></a><a class="outline-btn" href="account.html">Sign in</a></div></div></header><main id="main"><section class="results-hero"><div class="container"><p class="eyebrow">PROPERTY SEARCH</p><h1>Find a home with the facts upfront.</h1><div class="results-search"><label>Location<input id="q" placeholder="Town, city or postcode"></label><label>Min price<select id="min"><option value="0">Any</option><option value="250000">£250k</option><option value="350000">£350k</option><option value="450000">£450k</option></select></label><label>Max price<select id="max"><option value="9999999">Any</option><option value="500000">£500k</option><option value="750000">£750k</option><option value="1000000">£1m</option></select></label><label>Beds<select id="beds"><option value="0">Any</option><option value="2">2+</option><option value="3">3+</option><option value="4">4+</option></select></label><button class="search-btn" id="go" type="button">Search →</button></div><div class="filter-row" role="group" aria-label="Quick filters"><button class="filter active" data-filter="verified" type="button">✓ Verified information</button><button class="filter" data-filter="garden" type="button">Garden</button><button class="filter" data-filter="parking" type="button">Parking</button><button class="filter" data-filter="epc" type="button">EPC B+</button><button class="filter" data-filter="freehold" type="button">Freehold</button></div></div></section><section class="section"><div class="container"><div class="results-layout"><aside class="map-panel" aria-label="Map preview"><div class="map-grid"></div><span class="map-pin p1">£475k</span><span class="map-pin p2">£385k</span><span class="map-pin p3">£510k</span><span class="map-pin p4">£295k</span><div class="map-label">Map preview · select a property to open full details</div></aside><div><div class="result-head"><div><p class="eyebrow">MATCHING HOMES</p><h2 id="count">6 properties</h2></div><select id="sort" aria-label="Sort results"><option>Recommended</option><option>Newest</option><option>Lowest price</option><option>Highest price</option><option>Highest confidence</option></select></div><div class="property-grid" id="grid"></div></div></div></div></section></main><footer class="footer"><div class="container footer-bottom"><span>© 2026 Havenly demo</span><a href="accessibility.html">Accessibility</a><a href="privacy.html">Privacy</a></div></footer><script src="data.js"></script><script>const data=window.HAVENLY_PROPERTIES||[];const grid=document.getElementById('grid');const pound=n=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP',maximumFractionDigits:0}).format(n);let activeFilters=new Set(['verified']);let saved=JSON.parse(localStorage.getItem('havenlySaved')||'[]');function draw(list){document.getElementById('count').textContent=`${list.length} ${list.length===1?'property':'properties'}`;grid.innerHTML=list.map(p=>`<article class="property-card" tabindex="0" data-id="${p.id}"><div class="property-image"><img src="${p.image}" alt="${p.title} in ${p.location}" loading="lazy"><button class="save" type="button" aria-label="${saved.includes(p.id)?'Remove saved property':'Save property'}" data-save="${p.id}">${saved.includes(p.id)?'♥':'♡'}</button><span class="tag">${p.tag}</span></div><div class="property-info"><div class="price-row"><span class="price">${pound(p.price)}</span><span class="status">${p.status}</span></div><div class="property-title">${p.title}</div><div class="property-meta">${p.location}</div><div class="property-facts"><span>🛏 ${p.beds}</span><span>◫ ${p.baths}</span><span>↗ ${p.area}</span><span>⚡ ${p.epc}</span></div><div class="property-meta"><strong>${p.score}/100</strong> information confidence</div></div></article>`).join('')||'<div class="empty-state"><h3>No homes match</h3><p>Try widening your search or removing a filter.</p></div>';document.querySelectorAll('.property-card').forEach(c=>{c.onclick=e=>{if(!e.target.closest('.save'))location.href=`property.html?id=${c.dataset.id}`};c.onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&!e.target.closest('.save')){e.preventDefault();location.href=`property.html?id=${c.dataset.id}`}}});document.querySelectorAll('[data-save]').forEach(b=>b.onclick=e=>{e.stopPropagation();const id=Number(b.dataset.save);saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];localStorage.setItem('havenlySaved',JSON.stringify(saved));run()})}function run(){const q=document.getElementById('q').value.toLowerCase().trim();const min=+document.getElementById('min').value,max=+document.getElementById('max').value,b=+document.getElementById('beds').value;let list=data.filter(p=>(!q||`${p.location} ${p.title}`.toLowerCase().includes(q))&&p.price>=min&&p.price<=max&&p.beds>=b);if(activeFilters.has('garden'))list=list.filter(p=>/garden/i.test(p.garden));if(activeFilters.has('parking'))list=list.filter(p=>!/on-street/i.test(p.parking));if(activeFilters.has('epc'))list=list.filter(p=>['A','B'].includes(p.epc));if(activeFilters.has('freehold'))list=list.filter(p=>p.tenure==='Freehold');const s=document.getElementById('sort').value;if(s==='Lowest price')list.sort((a,b)=>a.price-b.price);if(s==='Highest price')list.sort((a,b)=>b.price-a.price);if(s==='Highest confidence')list.sort((a,b)=>b.score-a.score);if(s==='Newest')list=[...list].reverse();draw(list)}document.getElementById('go').onclick=run;document.getElementById('sort').onchange=run;document.getElementById('q').onkeydown=e=>{if(e.key==='Enter')run()};document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{const f=b.dataset.filter;if(f==='verified')return;b.classList.toggle('active');activeFilters.has(f)?activeFilters.delete(f):activeFilters.add(f);run()});draw(data);</script></body></html>
