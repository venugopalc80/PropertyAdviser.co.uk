<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Compare UK properties side by side with Havenly property intelligence."><meta name="theme-color" content="#0b1320"><title>Compare properties | Havenly</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="components.css"><style>.compare-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.compare-table td,.compare-table th{vertical-align:top}.compare-table img{display:block}.compare-score{font-weight:800}.compare-score.good{color:#3e7456}.compare-note{margin-top:18px;padding:14px 16px;border-radius:12px;background:#f6f8f6;color:#667085;font-size:12px;line-height:1.6}</style></head><body><a class="skip-link" href="#main">Skip to content</a><header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html"><span class="brand-mark">H</span><span>havenly<span class="brand-dot">.</span></span></a><nav class="nav" aria-label="Primary"><a href="properties.html">Buy</a><a href="properties.html?mode=rent">Rent</a><a href="index.html#insights">Insights</a><a href="agent.html">For agents</a></nav><div class="nav-actions"><a class="outline-btn" href="properties.html">Find homes</a><a class="ghost-btn" href="account.html">♡ Saved</a></div></div></header><main id="main" class="section"><div class="container"><p class="eyebrow">PROPERTY COMPARISON</p><h1 style="font:500 clamp(44px,6vw,72px) Georgia,serif;margin:8px 0 12px">Compare before you decide.</h1><p class="section-lead">Compare up to three saved homes across price, space, energy, tenure and key property information.</p><div id="comparison" style="margin-top:36px"></div></div></main><footer class="footer"><div class="container footer-bottom"><span>© Havenly demo by The Pixel Muses</span><a href="privacy.html">Privacy</a><a href="accessibility.html">Accessibility</a></div></footer><script src="data.js"></script><script>const all=window.HAVENLY_PROPERTIES||[];const ids=JSON.parse(localStorage.getItem('havenlyCompare')||'[]');const items=ids.map(id=>all.find(p=>p.id===id)).filter(Boolean).slice(0,3);const el=document.getElementById('comparison');const money=n=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP',maximumFractionDigits:0}).format(n);if(!items.length){el.innerHTML='<div class="empty-state"><h2>No properties selected</h2><p>Select up to three homes from search to compare them here.</p><a class="dark-btn" href="properties.html">Browse properties →</a></div>'}else{const rows=[['Price',p=>money(p.price)],['Location',p=>p.location],['Bedrooms',p=>p.beds],['Bathrooms',p=>p.baths],['Floor area',p=>p.area],['EPC',p=>p.epc],['Tenure',p=>p.tenure],['Council tax',p=>p.council],['Parking',p=>p.parking],['Garden',p=>p.garden],['Information confidence',p=>`<span class="compare-score ${p.score>=85?'good':''}">${p.score}/100</span>`]];el.innerHTML='<div style="overflow:auto;border:1px solid var(--line);border-radius:18px;background:#fff"><table class="compare-table" style="width:100%;border-collapse:collapse;min-width:900px"><thead><tr><th style="padding:18px;text-align:left;background:#f5f7f5">Compare</th>'+items.map(p=>'<th style="padding:18px;text-align:left;background:#f5f7f5;min-width:220px"><img src="'+p.image+'" alt="'+p.title+'" style="width:100%;height:130px;object-fit:cover;border-radius:12px"><div style="margin-top:10px;font-size:16px">'+p.title+'</div><small style="color:#667085">'+p.location+'</small><div class="compare-actions"><a class="dark-btn" href="property.html?id='+p.id+'">Details</a><a class="outline-btn" href="property-decision.html?id='+p.id+'">Decision view</a></div></th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr><th style="padding:15px 18px;text-align:left;border-top:1px solid #e2e8f0">'+r[0]+'</th>'+items.map(p=>'<td style="padding:15px 18px;border-top:1px solid #e2e8f0">'+r[1](p)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div><div class="compare-note">Property Confidence and related information are illustrative demo concepts. They are not valuations, surveys, legal verification or mortgage advice.</div><div style="margin-top:20px;display:flex;gap:10px;flex-wrap:wrap"><button class="outline-btn" id="clear" type="button">Clear comparison</button><a class="dark-btn" href="properties.html">Add more homes</a></div>';document.getElementById('clear').onclick=()=>{localStorage.removeItem('havenlyCompare');location.reload()}}</script></body></html>
