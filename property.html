<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Havenly UK property intelligence detail demo."><title>Property details | Havenly</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="components.css"></head><body><a class="skip-link" href="#main">Skip to content</a><header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html"><span class="brand-mark">H</span><span>havenly<span class="brand-dot">.</span></span></a><nav class="nav" aria-label="Primary"><a href="properties.html">Buy</a><a href="properties.html?mode=rent">Rent</a><a href="index.html#insights">Insights</a><a href="agent.html">For agents</a></nav><div class="nav-actions"><a class="ghost-btn" href="account.html">♡ Saved</a><a class="outline-btn" href="account.html">Sign in</a></div></div></header><main id="main"><div id="detail"></div></main><footer class="footer"><div class="container footer-bottom"><span>© 2026 Havenly demo</span><a href="accessibility.html">Accessibility</a><a href="privacy.html">Privacy</a></div></footer><div class="modal" id="viewModal" hidden><div class="modal-backdrop" data-close></div><div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="viewTitle"><button class="modal-close" data-close aria-label="Close">×</button><p class="eyebrow">REQUEST A VIEWING</p><h2 id="viewTitle">Choose a convenient time.</h2><p>Demo only. No real appointment is submitted.</p><form id="viewForm"><label class="modal-input"><span>Your name</span><input required id="viewName" placeholder="Your name"></label><label class="modal-input"><span>Email</span><input required type="email" id="viewEmail" placeholder="you@example.com"></label><label class="modal-input"><span>Preferred date</span><input required type="date" id="viewDate"></label><label class="modal-input"><span>Preferred time</span><select id="viewTime"><option>Morning</option><option>Afternoon</option><option>Early evening</option></select></label><button class="dark-btn full" type="submit">Request viewing →</button></form><div id="viewSuccess" hidden></div></div></div><script src="data.js"></script><script>const p=(window.HAVENLY_PROPERTIES||[]).find(x=>x.id===Number(new URLSearchParams(location.search).get('id')))||window.HAVENLY_PROPERTIES[0];const pound=n=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP',maximumFractionDigits:0}).format(n);document.title=`${p.title} | Havenly`;const saved=()=>JSON.parse(localStorage.getItem('havenlySaved')||'[]');document.getElementById('detail').innerHTML=`<section class="property-detail"><div class="container"><a class="back-link" href="properties.html">← Back to search</a><div class="detail-gallery"><img src="${p.image}" alt="${p.title} in ${p.location}"><div class="gallery-thumbs"><img src="${p.image}" alt="Property exterior"><img src="${p.image}" alt="Property interior"><img src="${p.image}" alt="Property garden"></div></div><div class="detail-layout"><article><p class="eyebrow">${p.status.toUpperCase()} · ${p.tag.toUpperCase()}</p><h1>${p.title}</h1><p class="location">${p.location}</p><div class="detail-price">${pound(p.price)}</div><div class="detail-facts large"><span><b>${p.beds}</b> bedrooms</span><span><b>${p.baths}</b> bathrooms</span><span><b>${p.area}</b></span><span><b>EPC ${p.epc}</b></span></div><section class="info-section"><h2>Property information</h2><div class="info-grid"><div><b>Tenure</b><span>${p.tenure}</span></div><div><b>Council tax</b><span>${p.council}</span></div><div><b>Parking</b><span>${p.parking}</span></div><div><b>Garden</b><span>${p.garden}</span></div><div><b>Heating</b><span>Gas central heating*</span></div><div><b>Broadband</b><span>Fibre available*</span></div></div></section><section class="info-section"><h2>Property confidence</h2><p>The demo score reflects how much structured information is available. It is not a survey, valuation or legal verification.</p><div class="check-list"><span>✓ Price and property type</span><span>✓ Tenure and council tax</span><span>✓ EPC information</span><span>✓ Parking and garden</span><span>✓ Property size and rooms</span><span>✓ Listing status</span></div></section><section class="info-section"><h2>Material information</h2><p>Production listings should surface relevant information clearly and before a buyer makes a transactional decision. This demo uses illustrative data.</p><div class="info-grid"><div><b>Water</b><span>Mains supply*</span></div><div><b>Sewerage</b><span>Mains drainage*</span></div><div><b>Construction</b><span>Standard construction*</span></div><div><b>Flood risk</b><span>Check required*</span></div><div><b>Planning</b><span>Check required*</span></div><div><b>Restrictions</b><span>Check title*</span></div></div></section><section class="info-section"><h2>About this home</h2><p>A polished example listing for the Havenly UK property marketplace. A production platform would connect each material field to authoritative or professionally verified data.</p></section></article><aside><div class="confidence-card"><div><span>PROPERTY CONFIDENCE</span><strong>${p.score}/100</strong></div><div class="meter"><span style="width:${p.score}%"></span></div><p>Illustrative demo score. Verification is still required before a real transaction.</p></div><div class="enquiry-card"><h3>Interested in this property?</h3><p>Save the home or request a viewing through the demo workflow.</p><button class="dark-btn full" id="saveBtn" type="button">${saved().includes(p.id)?'Saved ✓':'Save property ♡'}</button><button class="outline-btn full" id="viewBtn" type="button">Request a viewing</button></div><div class="enquiry-card"><h3>Need to check something?</h3><p>Ask the agent about material information or documents.</p><button class="outline-btn full" id="enquireBtn" type="button">Send enquiry</button></div></aside></div></div></section>`;const modal=document.getElementById('viewModal');const close=()=>{modal.hidden=true;document.body.style.overflow=''};document.querySelectorAll('[data-close]').forEach(x=>x.onclick=close);document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});document.getElementById('viewBtn').onclick=()=>{modal.hidden=false;document.body.style.overflow='hidden';document.getElementById('viewSuccess').hidden=true;document.getElementById('viewForm').hidden=false};document.getElementById('viewForm').onsubmit=e=>{e.preventDefault();document.getElementById('viewForm').hidden=true;const s=document.getElementById('viewSuccess');s.hidden=false;s.innerHTML='<div class="detail-score"><strong>Viewing request saved</strong><p>Your demo request has been captured locally. A production version would create a secure viewing request and notify the agent.</p><button class="dark-btn full" type="button" id="done">Done</button></div>';document.getElementById('done').onclick=close};document.getElementById('saveBtn').onclick=()=>{let ids=saved();if(ids.includes(p.id)){ids=ids.filter(id=>id!==p.id);document.getElementById('saveBtn').textContent='Save property ♡'}else{ids.push(p.id);document.getElementById('saveBtn').textContent='Saved ✓'}localStorage.setItem('havenlySaved',JSON.stringify(ids))};document.getElementById('enquireBtn').onclick=()=>{modal.hidden=false;document.body.style.overflow='hidden';document.getElementById('viewForm').hidden=true;const s=document.getElementById('viewSuccess');s.hidden=false;s.innerHTML='<div class="detail-score"><strong>Enquiry started</strong><p>Demo enquiry flow ready. A production version would send the message securely to the listing agent.</p><button class="dark-btn full" type="button" id="done2">Close</button></div>';document.getElementById('done2').onclick=close};</script></body></html>
