<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Property details, confidence and decision tools from Havenly."><meta name="theme-color" content="#0b1320"><title>Property details | Havenly</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="components.css"><style>.detail-page{padding:42px 0 80px}.detail-gallery{display:grid;grid-template-columns:1fr 150px;gap:12px;margin:22px 0}.detail-gallery>img{width:100%;height:500px;object-fit:cover;border-radius:20px}.gallery-thumbs{display:grid;gap:12px}.gallery-thumbs img{width:100%;height:158px;object-fit:cover;border-radius:14px}.detail-layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:28px}.detail-layout h1{font:600 clamp(38px,5vw,58px)/1.02 "Playfair Display",Georgia,serif;margin:8px 0}.location{color:#687382}.detail-price{font:600 34px "Playfair Display",Georgia,serif;margin:16px 0}.detail-facts{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}.detail-facts span{padding:10px 13px;border:1px solid var(--line);border-radius:10px;font-size:13px}.info-section{border-top:1px solid var(--line);padding:28px 0}.info-section h2{font:600 28px "Playfair Display",Georgia,serif}.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.info-grid div{padding:14px;background:#f7f8fa;border-radius:12px}.info-grid b,.info-grid span{display:block}.info-grid span{margin-top:4px;color:#687382;font-size:13px}.confidence-card,.enquiry-card{border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:14px;background:#fff;box-shadow:0 12px 35px rgba(11,19,32,.06)}.confidence-card>div:first-child{display:flex;justify-content:space-between;align-items:center}.confidence-card small{letter-spacing:1px}.confidence-card strong{font-size:34px}.meter{height:8px;background:#e7ece8;border-radius:99px;overflow:hidden;margin:14px 0}.meter span{display:block;height:100%;background:#5f896f}.confidence-card p,.enquiry-card p{font-size:13px;color:#687382;line-height:1.6}.full{width:100%;margin-top:9px}.decision-link{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 16px;background:#0b1320;color:#fff;border-radius:12px;text-decoration:none;font-weight:700;margin-top:10px}.decision-link small{font-weight:400;color:#cbd5e1}.back-link{display:inline-block;margin-bottom:8px}.detail-score{padding:16px;background:#f5f7fa;border-radius:12px}.status-note{font-size:12px;color:#667085;margin-top:8px}.verification-note{padding:14px 16px;background:#f6faf7;border:1px solid #dbe5de;border-radius:12px;color:#52645a;font-size:12px;line-height:1.6;margin-top:14px}.skip-link{position:absolute;left:-9999px}.skip-link:focus{left:10px;top:10px;z-index:200;background:#fff;padding:10px}@media(max-width:850px){.detail-gallery{grid-template-columns:1fr}.gallery-thumbs{grid-template-columns:repeat(3,1fr)}.gallery-thumbs img{height:90px}.detail-gallery>img{height:300px}.detail-layout{grid-template-columns:1fr}.info-grid{grid-template-columns:1fr}}</style></head><body><a class="skip-link" href="#main">Skip to content</a><header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html"><span class="brand-mark">H</span><span>havenly<span class="brand-dot">.</span></span></a><nav class="nav" aria-label="Primary"><a href="properties.html">Buy</a><a href="properties.html?mode=rent">Rent</a><a href="property-intelligence.html">Insights</a><a href="agent.html">For agents</a></nav><div class="nav-actions"><a class="ghost-btn" href="account.html">♡ Saved</a><a class="outline-btn" href="signin.html">Sign in</a></div></div></header><main id="main"><section class="detail-page"><div class="container" id="detail"></div></section></main><footer class="footer"><div class="container footer-bottom"><span>© Havenly demo by The Pixel Muses</span><a href="accessibility.html">Accessibility</a><a href="privacy.html">Privacy</a><a href="cookies.html">Cookies</a><a href="terms.html">Terms</a></div></footer><script src="data.js"></script><script src="supabase-client.js"></script><script src="supabase-data.js"></script><script>const properties=window.HAVENLY_PROPERTIES||[],id=Number(new URLSearchParams(location.search).get('id'))||1,p=properties.find(x=>x.id===id),money=n=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP',maximumFractionDigits:0}).format(n),detail=document.getElementById('detail'),esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));if(!p){detail.innerHTML='<a class="back-link" href="properties.html">← Back to search</a><h1>Property not found</h1><p>The property requested is not available.</p>'}else{document.title=`${p.title} | Havenly`;detail.innerHTML=`<a class="back-link" href="properties.html">← Back to search</a><div class="detail-gallery"><img src="${esc(p.image)}" alt="${esc(p.title)} in ${esc(p.location)}"><div class="gallery-thumbs"><img src="${esc(p.image)}" alt="Property exterior view 1"><img src="${esc(p.image)}" alt="Property exterior view 2"><img src="${esc(p.image)}" alt="Property exterior view 3"></div></div><div class="detail-layout"><article><p class="eyebrow">${esc(p.status).toUpperCase()} · ${esc(p.tag).toUpperCase()}</p><h1>${esc(p.title)}</h1><p class="location">${esc(p.location)}</p><div class="detail-price">${money(p.price)}</div><div class="detail-facts"><span><b>${p.beds}</b> bedrooms</span><span><b>${p.baths}</b> bathrooms</span><span><b>${esc(p.area)}</b></span><span><b>EPC ${esc(p.epc)}</b></span></div><section class="info-section"><h2>Property information</h2><div class="info-grid"><div><b>Tenure</b><span>${esc(p.tenure)}</span></div><div><b>Council tax</b><span>${esc(p.council)}</span></div><div><b>Parking</b><span>${esc(p.parking)}</span></div><div><b>Garden</b><span>${esc(p.garden)}</span></div><div><b>Heating</b><span>Gas central heating*</span></div><div><b>Broadband</b><span>Fibre available*</span></div></div></section><section class="info-section"><h2>About this home</h2><p>A polished Havenly listing showing the information a buyer can review before deciding whether to pursue a property. Production listing facts should be independently verified.</p></section><section class="info-section"><h2>Material information</h2><p>Key checks are surfaced early so buyers can understand what is known and what still needs verification.</p><div class="info-grid"><div><b>Water</b><span>Mains supply*</span></div><div><b>Sewerage</b><span>Mains drainage*</span></div><div><b>Flood risk</b><span>Check required*</span></div><div><b>Planning</b><span>Check required*</span></div><div><b>Construction</b><span>Standard construction*</span></div><div><b>Restrictions</b><span>Check title*</span></div></div><div class="verification-note"><strong>* Demo information.</strong> These entries are illustrative and must not be treated as verified property facts. In production, each material item should have an appropriate source, confirmation status and review date. <a href="property-verification.html">See verification approach →</a></div></section></article><aside><div class="confidence-card"><div><small>PROPERTY CONFIDENCE</small><strong>${p.score}/100</strong></div><div class="meter"><span style="width:${p.score}%"></span></div><p>Illustrative demo score based on structured information. It is not a survey, valuation or legal verification.</p></div><div class="enquiry-card"><h3>Should you pursue this home?</h3><p>See value, affordability and outstanding checks together before making an offer.</p><a class="decision-link" href="property-decision.html?id=${p.id}"><span>Open decision view<br><small>Understand the decision</small></span><span>→</span></a></div><div class="enquiry-card"><h3>Interested in this property?</h3><button class="dark-btn full" id="saveBtn" type="button">Save property ♡</button><button class="outline-btn full" id="viewBtn" type="button">Request a viewing</button><a class="outline-btn full" href="enquiry.html?id=${p.id}&type=general">Send enquiry</a><div class="status-note" id="saveNote" aria-live="polite"></div></div></aside></div>`;const saveBtn=document.getElementById('saveBtn'),note=document.getElementById('saveNote');(async()=>{try{const ids=await window.havenlyData.savedPropertyIds();if(ids?.includes(p.id))saveBtn.textContent='Saved ✓'}catch(e){}})();saveBtn.onclick=async()=>{saveBtn.disabled=true;try{const user=await window.havenlyData.user();if(!user){location.href='signin.html?return='+encodeURIComponent(location.pathname+location.search);return}const ids=await window.havenlyData.savedPropertyIds()||[];if(ids.includes(p.id)){await window.havenlyData.unsaveProperty(p);saveBtn.textContent='Save property ♡';note.textContent='Removed from your shortlist.'}else{await window.havenlyData.saveProperty(p);saveBtn.textContent='Saved ✓';note.textContent='Saved to your Havenly shortlist.'}}catch(e){console.error(e);note.textContent='Unable to update your shortlist. Please try again.'}finally{saveBtn.disabled=false}};document.getElementById('viewBtn').onclick=()=>location.href=`enquiry.html?id=${p.id}&type=viewing`}</script></body></html>
