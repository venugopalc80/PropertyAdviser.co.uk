<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Property details, confidence and decision tools from Havenly."><meta name="theme-color" content="#0b1320">
<title>Property details | Havenly</title>
<link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="components.css">
<style>
.detail-page{padding:42px 0 80px}.detail-gallery{display:grid;grid-template-columns:1fr 150px;gap:12px;margin:22px 0}.detail-gallery>img{width:100%;height:500px;object-fit:cover;border-radius:20px}.gallery-thumbs{display:grid;gap:12px}.gallery-thumbs img{width:100%;height:158px;object-fit:cover;border-radius:14px}.detail-layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:28px}.detail-layout h1{font:600 clamp(38px,5vw,58px)/1.02 "Playfair Display",Georgia,serif;margin:8px 0}.location{color:#687382}.detail-price{font:600 34px "Playfair Display",Georgia,serif;margin:16px 0}.detail-facts{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}.detail-facts span{padding:10px 13px;border:1px solid var(--line);border-radius:10px;font-size:13px}.info-section{border-top:1px solid var(--line);padding:28px 0}.info-section h2{font:600 28px "Playfair Display",Georgia,serif}.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.info-grid div{padding:14px;background:#f7f8fa;border-radius:12px}.info-grid b,.info-grid span{display:block}.info-grid span{margin-top:4px;color:#687382;font-size:13px}.confidence-card,.enquiry-card{border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:14px;background:#fff;box-shadow:0 12px 35px rgba(11,19,32,.06)}.confidence-card>div:first-child{display:flex;justify-content:space-between;align-items:center}.confidence-card small{letter-spacing:1px}.confidence-card strong{font-size:34px}.meter{height:8px;background:#e7ece8;border-radius:99px;overflow:hidden;margin:14px 0}.meter span{display:block;height:100%;background:#5f896f}.confidence-card p,.enquiry-card p{font-size:13px;color:#687382;line-height:1.6}.full{width:100%;margin-top:9px}.decision-link{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 16px;background:#0b1320;color:#fff;border-radius:12px;text-decoration:none;font-weight:700;margin-top:10px}.decision-link small{font-weight:400;color:#cbd5e1}.modal{position:fixed;inset:0;z-index:100}.modal[hidden]{display:none}.modal-backdrop{position:absolute;inset:0;background:rgba(11,19,32,.58)}.modal-panel{position:relative;z-index:1;width:min(560px,calc(100% - 30px));margin:7vh auto;background:#fff;border-radius:20px;padding:28px;max-height:86vh;overflow:auto}.modal-close{position:absolute;right:15px;top:12px;border:0;background:none;font-size:28px;cursor:pointer}.modal-input{display:grid;gap:7px;margin:12px 0}.modal-input input,.modal-input select{padding:12px;border:1px solid #d7dde5;border-radius:10px;font:inherit}.detail-score{padding:16px;background:#f5f7fa;border-radius:12px}.skip-link{position:absolute;left:-9999px}.skip-link:focus{left:10px;top:10px;z-index:200;background:#fff;padding:10px}@media(max-width:850px){.detail-gallery{grid-template-columns:1fr}.gallery-thumbs{grid-template-columns:repeat(3,1fr)}.gallery-thumbs img{height:90px}.detail-gallery>img{height:300px}.detail-layout{grid-template-columns:1fr}.info-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html"><span class="brand-mark">H</span><span>havenly<span class="brand-dot">.</span></span></a><nav class="nav" aria-label="Primary"><a href="properties.html">Buy</a><a href="properties.html?mode=rent">Rent</a><a href="property-intelligence.html">Insights</a><a href="agent.html">For agents</a></nav><div class="nav-actions"><a class="ghost-btn" href="account.html">♡ Saved</a><a class="outline-btn" href="signin.html">Sign in</a></div></div></header>
<main id="main"><section class="detail-page"><div class="container" id="detail"></div></section></main>
<footer class="footer"><div class="container footer-bottom"><span>© Havenly demo by The Pixel Muses</span><a href="accessibility.html">Accessibility</a><a href="privacy.html">Privacy</a></div></footer>
<div class="modal" id="viewModal" hidden><div class="modal-backdrop" data-close></div><div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="viewTitle"><button class="modal-close" data-close aria-label="Close">×</button><p class="eyebrow">REQUEST A VIEWING</p><h2 id="viewTitle">Choose a convenient time.</h2><p>Demo only. No real appointment is submitted.</p><form id="viewForm"><label class="modal-input"><span>Your name</span><input required id="viewName" autocomplete="name"></label><label class="modal-input"><span>Email</span><input required type="email" id="viewEmail" autocomplete="email"></label><label class="modal-input"><span>Preferred date</span><input required type="date" id="viewDate"></label><label class="modal-input"><span>Preferred time</span><select id="viewTime"><option>Morning</option><option>Afternoon</option><option>Early evening</option></select></label><button class="dark-btn full" type="submit">Request viewing →</button></form><div id="viewSuccess" hidden></div></div></div>
<script src="data.js"></script><script>
const properties=window.HAVENLY_PROPERTIES||[];const id=Number(new URLSearchParams(location.search).get('id'))||1;const p=properties.find(x=>x.id===id);const money=n=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP',maximumFractionDigits:0}).format(n);const detail=document.getElementById('detail');const saved=()=>JSON.parse(localStorage.getItem('havenlySaved')||'[]');
if(!p){detail.innerHTML='<a class="back-link" href="properties.html">← Back to search</a><h1>Property not found</h1><p>The property requested is not available in this demo.</p>'}else{document.title=`${p.title} | Havenly`;detail.innerHTML=`<a class="back-link" href="properties.html">← Back to search</a><div class="detail-gallery"><img src="${p.image}" alt="${p.title} in ${p.location}"><div class="gallery-thumbs"><img src="${p.image}" alt="Property exterior"><img src="${p.image}" alt="Property interior"><img src="${p.image}" alt="Property garden"></div></div><div class="detail-layout"><article><p class="eyebrow">${p.status.toUpperCase()} · ${p.tag.toUpperCase()}</p><h1>${p.title}</h1><p class="location">${p.location}</p><div class="detail-price">${money(p.price)}</div><div class="detail-facts"><span><b>${p.beds}</b> bedrooms</span><span><b>${p.baths}</b> bathrooms</span><span><b>${p.area}</b></span><span><b>EPC ${p.epc}</b></span></div><section class="info-section"><h2>Property information</h2><div class="info-grid"><div><b>Tenure</b><span>${p.tenure}</span></div><div><b>Council tax</b><span>${p.council}</span></div><div><b>Parking</b><span>${p.parking}</span></div><div><b>Garden</b><span>${p.garden}</span></div><div><b>Heating</b><span>Gas central heating*</span></div><div><b>Broadband</b><span>Fibre available*</span></div></div></section><section class="info-section"><h2>About this home</h2><p>A polished demo listing showing how a UK property platform can surface key facts before a buyer makes a decision. Production data should be independently verified.</p></section><section class="info-section"><h2>Material information</h2><p>Important checks should be visible early rather than hidden behind multiple steps.</p><div class="info-grid"><div><b>Water</b><span>Mains supply*</span></div><div><b>Sewerage</b><span>Mains drainage*</span></div><div><b>Flood risk</b><span>Check required*</span></div><div><b>Planning</b><span>Check required*</span></div><div><b>Construction</b><span>Standard construction*</span></div><div><b>Restrictions</b><span>Check title*</span></div></div></section></article><aside><div class="confidence-card"><div><small>PROPERTY CONFIDENCE</small><strong>${p.score}/100</strong></div><div class="meter"><span style="width:${p.score}%"></span></div><p>Illustrative demo score based on structured information. It is not a survey, valuation or legal verification.</p></div><div class="enquiry-card"><h3>Should you pursue this home?</h3><p>See value, affordability and outstanding checks together before making an offer.</p><a class="decision-link" href="property-decision.html?id=${p.id}"><span>Open decision view<br><small>Understand the decision</small></span><span>→</span></a></div><div class="enquiry-card"><h3>Interested in this property?</h3><button class="dark-btn full" id="saveBtn" type="button">${saved().includes(p.id)?'Saved ✓':'Save property ♡'}</button><button class="outline-btn full" id="viewBtn" type="button">Request a viewing</button></div><div class="enquiry-card"><h3>Need to check something?</h3><p>Ask the agent about documents or material information.</p><button class="outline-btn full" id="enquireBtn" type="button">Send enquiry</button></div></aside></div>`;
const modal=document.getElementById('viewModal');const close=()=>{modal.hidden=true;document.body.style.overflow=''};document.querySelectorAll('[data-close]').forEach(x=>x.onclick=close);document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});document.getElementById('viewBtn').onclick=()=>{modal.hidden=false;document.body.style.overflow='hidden';document.getElementById('viewForm').hidden=false;document.getElementById('viewSuccess').hidden=true};document.getElementById('viewForm').onsubmit=e=>{e.preventDefault();document.getElementById('viewForm').hidden=true;const s=document.getElementById('viewSuccess');s.hidden=false;s.innerHTML='<div class="detail-score"><strong>Viewing request saved</strong><p>Your demo request has been captured locally. A production version would notify the agent securely.</p><button class="dark-btn full" type="button" id="done">Done</button></div>';document.getElementById('done').onclick=close};document.getElementById('saveBtn').onclick=()=>{let ids=saved();if(ids.includes(p.id)){ids=ids.filter(x=>x!==p.id);document.getElementById('saveBtn').textContent='Save property ♡'}else{ids.push(p.id);document.getElementById('saveBtn').textContent='Saved ✓'}localStorage.setItem('havenlySaved',JSON.stringify(ids))};document.getElementById('enquireBtn').onclick=()=>{modal.hidden=false;document.body.style.overflow='hidden';document.getElementById('viewForm').hidden=true;const s=document.getElementById('viewSuccess');s.hidden=false;s.innerHTML='<div class="detail-score"><strong>Enquiry started</strong><p>Demo enquiry flow is ready. A production version would securely send the enquiry to the listing agent.</p><button class="dark-btn full" type="button" id="done2">Close</button></div>';document.getElementById('done2').onclick=close};}
</script></body></html>
