<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Havenly property intelligence detail demo."><title>Property details | Havenly</title><link rel="stylesheet" href="styles.css"></head><body><a class="skip-link" href="#main">Skip to content</a><header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html"><span class="brand-mark">H</span><span>havenly<span class="brand-dot">.</span></span></a><nav class="nav"><a href="properties.html">Buy</a><a href="properties.html?mode=rent">Rent</a><a href="index.html#insights">Insights</a><a href="agent.html">For agents</a></nav><div class="nav-actions"><a class="ghost-btn" href="account.html">♡ Saved</a><a class="outline-btn" href="account.html">Sign in</a></div></div></header><main id="main"><div id="detail"></div></main><footer class="footer"><div class="container footer-bottom"><span>© 2026 Havenly demo</span><a href="accessibility.html">Accessibility</a><a href="privacy.html">Privacy</a></div></footer><script src="data.js"></script><script>const p=(window.HAVENLY_PROPERTIES||[]).find(x=>x.id===Number(new URLSearchParams(location.search).get('id'))) || window.HAVENLY_PROPERTIES[0];const pound=n=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP',maximumFractionDigits:0}).format(n);document.title=`${p.title} | Havenly`;document.getElementById('detail').innerHTML=`<section class="property-detail"><div class="container"><a class="back-link" href="properties.html">← Back to search</a><div class="detail-gallery"><img src="${p.image}" alt="${p.title} in ${p.location}"><div class="gallery-thumbs"><img src="${p.image}" alt="Property exterior"><img src="${p.image}" alt="Property photo"><img src="${p.image}" alt="Property photo"></div></div><div class="detail-layout"><article><p class="eyebrow">${p.status.toUpperCase()} · ${p.tag.toUpperCase()}</p><h1>${p.title}</h1><p class="location">${p.location}</p><div class="detail-price">${pound(p.price)}</div><div class="detail-facts large"><span><b>${p.beds}</b> bedrooms</span><span><b>${p.baths}</b> bathrooms</span><span><b>${p.area}</b></span><span><b>EPC ${p.epc}</b></span></div><section class="info-section"><h2>Property information</h2><div class="info-grid"><div><b>Tenure</b><span>${p.tenure}</span></div><div><b>Council tax</b><span>${p.council}</span></div><div><b>Parking</b><span>${p.parking}</span></div><div><b>Garden</b><span>${p.garden}</span></div><div><b>Heating</b><span>Gas central heating</span></div><div><b>Broadband</b><span>Fibre available*</span></div></div></section><section class="info-section"><h2>About this home</h2><p>A polished example listing for the Havenly UK property marketplace. In production, every material field would be sourced and verified against authoritative data before publication.</p></section><section class="info-section"><h2>Material information</h2><div class="check-list"><span>✓ Price displayed clearly</span><span>✓ Tenure disclosed</span><span>✓ Council tax disclosed</span><span>✓ EPC shown</span><span>✓ Parking and garden information</span><span>✓ Verification status visible</span></div></section></article><aside><div class="confidence-card"><div><span>PROPERTY CONFIDENCE</span><strong>${p.score}/100</strong></div><div class="meter"><span style="width:${p.score}%"></span></div><p>High-confidence demo listing. Two items still require verification before a real transaction.</p></div><div class="enquiry-card"><h3>Interested in this property?</h3><p>Save it or request a viewing. This demo stores your shortlist locally.</p><button class="dark-btn full" onclick="save()">Save property ♡</button><button class="outline-btn full" onclick="alert('Viewing request captured in demo mode.')">Request a viewing</button></div></aside></div></div></section>`;function save(){let ids=JSON.parse(localStorage.getItem('havenlySaved')||'[]');if(!ids.includes(p.id))ids.push(p.id);localStorage.setItem('havenlySaved',JSON.stringify(ids));alert('Property saved. Sign in would sync this across devices in production.');}</script></body></html>
