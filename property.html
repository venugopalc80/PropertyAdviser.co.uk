<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Property details, evidence and decision tools from Havenly."><meta name="theme-color" content="#0b1320"><title>Property details | Havenly</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="components.css"><style>.detail-page{padding:42px 0 80px}.detail-gallery{display:grid;grid-template-columns:1fr 150px;gap:12px;margin:22px 0}.detail-gallery>img{width:100%;height:500px;object-fit:cover;border-radius:20px}.gallery-thumbs{display:grid;gap:12px}.gallery-thumbs img{width:100%;height:158px;object-fit:cover;border-radius:14px}.detail-layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:28px}.detail-layout h1{font:600 clamp(38px,5vw,58px)/1.02 "Playfair Display",Georgia,serif;margin:8px 0}.location{color:#687382}.detail-price{font:600 34px "Playfair Display",Georgia,serif;margin:16px 0}.detail-facts{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}.detail-facts span{padding:10px 13px;border:1px solid var(--line);border-radius:10px;font-size:13px}.info-section{border-top:1px solid var(--line);padding:28px 0}.info-section h2{font:600 28px "Playfair Display",Georgia,serif}.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.info-grid div{padding:14px;background:#f7f8fa;border-radius:12px}.info-grid b,.info-grid span{display:block}.info-grid span{margin-top:4px;color:#687382;font-size:13px}.confidence-card,.enquiry-card,.passport-card{border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:14px;background:#fff;box-shadow:0 12px 35px rgba(11,19,32,.06)}.confidence-card>div:first-child{display:flex;justify-content:space-between;align-items:center}.confidence-card small{letter-spacing:1px}.confidence-card strong{font-size:34px}.meter{height:8px;background:#e7ece8;border-radius:99px;overflow:hidden;margin:14px 0}.meter span{display:block;height:100%;background:#5f896f}.confidence-card p,.enquiry-card p{font-size:13px;color:#687382;line-height:1.6}.full{width:100%;margin-top:9px}.decision-link{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 16px;background:#0b1320;color:#fff;border-radius:12px;text-decoration:none;font-weight:700;margin-top:10px}.decision-link small{font-weight:400;color:#cbd5e1}.back-link{display:inline-block;margin-bottom:8px}.status-note{font-size:12px;color:#667085;margin-top:8px}.passport-card{padding:24px}.passport-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.passport-head h2{margin:0 0 6px;font:600 28px "Playfair Display",Georgia,serif}.passport-head p{margin:0;color:#687382;font-size:13px;max-width:620px}.passport-summary{padding:15px;background:#f6f8f6;border-radius:14px;min-width:150px;text-align:center}.passport-summary strong{display:block;font-size:25px}.passport-summary span{font-size:11px;color:#687382}.passport-groups{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}.passport-group{border:1px solid var(--line);border-radius:16px;padding:16px}.passport-group h3{font-size:14px;margin:0 0 4px}.passport-group>p{font-size:11px;color:#687382;margin:0 0 12px}.passport-list{display:grid;gap:9px}.passport-item{padding:12px;border:1px solid var(--line);border-radius:12px}.passport-item-top{display:flex;justify-content:space-between;gap:10px;align-items:center}.passport-item b{font-size:12px}.passport-value{font-size:13px;margin-top:5px}.passport-meta{font-size:10px;color:#687382;margin-top:6px;line-height:1.4}.badge{font-size:9px;font-weight:800;letter-spacing:.4px;padding:4px 7px;border-radius:999px;white-space:nowrap}.badge.confirmed{background:#eaf5ee;color:#37694d}.badge.stated{background:#eef2f7;color:#526174}.badge.review{background:#fff6df;color:#8a6a1d}.badge.na{background:#f1f2f3;color:#687382}.verification-note{padding:14px 16px;background:#f6faf7;border:1px solid #dbe5de;border-radius:12px;color:#52645a;font-size:12px;line-height:1.6;margin-top:16px}.confidence-breakdown{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}.confidence-breakdown div{padding:9px;background:#f7f8fa;border-radius:9px;text-align:center;font-size:10px;color:#687382}.confidence-breakdown strong{display:block;font-size:15px;color:#0b1320}.skip-link{position:absolute;left:-9999px}.skip-link:focus{left:10px;top:10px;z-index:200;background:#fff;padding:10px}@media(max-width:850px){.detail-gallery{grid-template-columns:1fr}.gallery-thumbs{grid-template-columns:repeat(3,1fr)}.gallery-thumbs img{height:90px}.detail-gallery>img{height:300px}.detail-layout{grid-template-columns:1fr}.info-grid,.passport-groups{grid-template-columns:1fr}.passport-head{display:block}.passport-summary{margin-top:16px}.confidence-breakdown{grid-template-columns:1fr 1fr 1fr}}</style></head><body><a class="skip-link" href="#main">Skip to content</a><header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html"><span class="brand-mark">H</span><span>havenly<span class="brand-dot">.</span></span></a><nav class="nav" aria-label="Primary"><a href="properties.html">Buy</a><a href="properties.html?mode=rent">Rent</a><a href="property-intelligence.html">Insights</a><a href="agent.html">For agents</a></nav><div class="nav-actions"><a class="ghost-btn" href="account.html">♡ Saved</a><a class="outline-btn" href="signin.html">Sign in</a></div></div></header><main id="main"><section class="detail-page"><div class="container" id="detail"></div></section></main><footer class="footer"><div class="container footer-bottom"><span>© Havenly demo by The Pixel Muses</span><a href="accessibility.html">Accessibility</a><a href="privacy.html">Privacy</a><a href="cookies.html">Cookies</a><a href="terms.html">Terms</a></div></footer><script src="data.js"></script><script src="supabase-client.js"></script><script src="supabase-data.js"></script><script>const properties=window.HAVENLY_PROPERTIES||[],id=Number(new URLSearchParams(location.search).get('id'))||1,p=properties.find(x=>x.id===id),money=n=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP',maximumFractionDigits:0}).format(n),detail=document.getElementById('detail'),esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const demoPassport=x=>[['price','Price',money(x.price),'agent_stated','Listing data'],['tenure','Tenure',x.tenure,'agent_stated','Listing data'],['epc_rating','EPC',`Band ${x.epc}`,'agent_stated','Listing data'],['council_tax','Council tax',x.council,'agent_stated','Listing data'],['property_type','Property type',x.tag||'Residential','agent_stated','Listing data'],['bedrooms','Bedrooms',String(x.beds),'agent_stated','Listing data'],['bathrooms','Bathrooms',String(x.baths),'agent_stated','Listing data'],['floor_area','Floor area',x.area,'agent_stated','Listing data'],['parking','Parking',x.parking,'agent_stated','Listing data'],['garden','Garden',x.garden,'agent_stated','Listing data'],['water','Water supply','Not provided','not_provided','Source required'],['sewerage','Sewerage','Not provided','not_provided','Source required'],['heating','Heating','Not provided','not_provided','Source required'],['broadband','Broadband','Not provided','not_provided','Source required'],['mobile','Mobile coverage','Not provided','not_provided','Source required'],['flood_risk','Flood risk','Check required','needs_review','External verification'],['planning','Planning permission','Check required','needs_review','Local authority / agent'],['restrictions','Restrictions','Check title','needs_review','Title review'],['construction','Construction','Not provided','not_provided','Technical review'],['rights_easements','Rights & easements','Check title','needs_review','Title review'],['issues','Known property issues','Not provided','not_provided','Seller / agent disclosure'],['building_safety','Building safety','Not provided','not_provided','Technical review'],['coastal_erosion','Coastal erosion','Not provided','not_provided','External verification'],['mining','Mining / coalfield','Not provided','not_provided','External verification'],['lease_terms','Lease terms','Not provided','not_provided','Lease review'],['ground_rent','Ground rent','Not provided','not_provided','Lease review'],['service_charges','Service charges','Not provided','not_provided','Lease / managing agent'],['accessibility','Accessibility / adaptations','Not provided','not_provided','Agent / seller']];const groups=[['Core facts',['price','tenure','epc_rating','council_tax','property_type','bedrooms','bathrooms','floor_area'],'What the listing says about the home.'],['Running costs & utilities',['water','sewerage','heating','broadband','mobile','council_tax','ground_rent','service_charges'],'Costs and services that can materially affect affordability.'],['Legal & title',['tenure','lease_terms','restrictions','rights_easements','planning'],'Information that may need title, lease or local-authority evidence.'],['Risk & condition',['flood_risk','construction','issues','building_safety','coastal_erosion','mining','accessibility','parking','garden'],'Checks that can change whether the property is suitable.']];const statusLabel=s=>({confirmed:'Confirmed',agent_stated:'Agent stated',needs_review:'Needs review',not_applicable:'Not applicable',not_provided:'Not provided'}[s]||'Needs review'),badgeClass=s=>s==='confirmed'?'confirmed':s==='agent_stated'?'stated':s==='not_applicable'?'na':'review';async function loadPassport(x){let rows=[];try{const c=await window.havenlyData.client();if(c&&x.dbId){const r=await c.from('property_data_passport').select('field_key,field_label,value_text,status,source_name,source_url,reviewed_at,notes').eq('property_id',x.dbId).order('field_label');if(!r.error)rows=r.data||[]}}catch(e){console.warn('Passport unavailable',e)}return rows.length?rows:demoPassport(x).map(([field_key,field_label,value_text,status,source_name])=>({field_key,field_label,value_text,status,source_name}))}function renderPassport(rows){const confirmed=rows.filter(r=>r.status==='confirmed').length,stated=rows.filter(r=>r.status==='agent_stated').length,review=rows.filter(r=>['needs_review','not_provided'].includes(r.status)).length;const byKey=Object.fromEntries(rows.map(r=>[r.field_key,r]));return `<section class="passport-card info-section"><div class="passport-head"><div><h2>Property Data Passport</h2><p>Decision-critical facts are grouped by what they mean to a buyer, with provenance and unresolved checks kept visible.</p></div><div class="passport-summary"><strong>${confirmed}</strong><span>source-confirmed fields</span></div></div><div class="passport-groups">${groups.map(g=>`<section class="passport-group"><h3>${g[0]}</h3><p>${g[2]}</p><div class="passport-list">${g[1].filter((key,i,a)=>a.indexOf(key)===i).map(key=>{const r=byKey[key]||{field_key:key,field_label:key.replace(/_/g,' '),value_text:'Not provided',status:'not_provided'};return `<div class="passport-item"><div class="passport-item-top"><b>${esc(r.field_label)}</b><span class="badge ${badgeClass(r.status)}">${statusLabel(r.status)}</span></div><div class="passport-value">${esc(r.value_text||'Not provided')}</div><div class="passport-meta">${esc(r.source_name||'No source recorded')}${r.reviewed_at?' · Reviewed '+new Date(r.reviewed_at).toLocaleDateString('en-GB'):''}</div></div>`}).join('')}</div></section>`).join('')}</div><div class="verification-note"><strong>${confirmed} confirmed · ${stated} agent stated · ${review} unresolved.</strong> A high score must never hide missing material information. Buyers should review unresolved items before viewing, offering or contracting. <a href="property-verification.html">See the verification approach →</a></div></section>`}function confidence(rows){if(window.havenlyData?.propertyConfidence)return window.havenlyData.propertyConfidence(rows);return {score:0,confirmed:0,stated:0,review:rows.length,totalFields:rows.length}}async function render(){if(!p){detail.innerHTML='<a class="back-link" href="properties.html">← Back to search</a><h1>Property not found</h1><p>The property requested is not available.</p>';return}document.title=`${p.title} | Havenly`;detail.innerHTML=`<a class="back-link" href="properties.html">← Back to search</a><div class="detail-gallery"><img src="${esc(p.image)}" alt="${esc(p.title)} in ${esc(p.location)}"><div class="gallery-thumbs"><img src="${esc(p.image)}" alt="Property exterior view 1"><img src="${esc(p.image)}" alt="Property exterior view 2"><img src="${esc(p.image)}" alt="Property exterior view 3"></div></div><div class="detail-layout"><article><p class="eyebrow">${esc(p.status).toUpperCase()} · ${esc(p.tag).toUpperCase()}</p><h1>${esc(p.title)}</h1><p class="location">${esc(p.location)}</p><div class="detail-price">${money(p.price)}</div><div class="detail-facts"><span><b>${p.beds}</b> bedrooms</span><span><b>${p.baths}</b> bathrooms</span><span><b>${esc(p.area)}</b></span><span><b>EPC ${esc(p.epc)}</b></span></div><section class="info-section"><h2>Property information</h2><div class="info-grid"><div><b>Tenure</b><span>${esc(p.tenure)}</span></div><div><b>Council tax</b><span>${esc(p.council)}</span></div><div><b>Parking</b><span>${esc(p.parking)}</span></div><div><b>Garden</b><span>${esc(p.garden)}</span></div></div></section><section class="info-section"><h2>About this home</h2><p>A Havenly listing designed to put decision-critical information earlier in the buyer journey. Production listing facts should be independently verified.</p></section><div id="passportMount"><section class="passport-card info-section"><h2>Property Data Passport</h2><p>Loading evidence and verification status…</p></section></div></article><aside><div class="confidence-card"><div><small>PROPERTY CONFIDENCE</small><strong>—</strong></div><div class="meter"><span style="width:0%"></span></div><p>Calculating confidence from Passport evidence…</p><div class="confidence-breakdown"><div><strong id="confConfirmed">—</strong>confirmed</div><div><strong id="confStated">—</strong>agent stated</div><div><strong id="confReview">—</strong>unresolved</div></div></div><div class="enquiry-card"><h3>Should you pursue this home?</h3><p>See value, affordability and outstanding checks together before making an offer.</p><a class="decision-link" href="property-decision.html?id=${p.id}"><span>Open decision view<br><small>Understand the decision</small></span><span>→</span></a></div><div class="enquiry-card"><h3>Interested in this property?</h3><button class="dark-btn full" id="saveBtn" type="button">Save property ♡</button><button class="outline-btn full" id="viewBtn" type="button">Request a viewing</button><a class="outline-btn full" href="enquiry.html?id=${p.id}&type=general">Send enquiry</a><div class="status-note" id="saveNote" aria-live="polite"></div></div></aside></div>`;const rows=await loadPassport(p);document.getElementById('passportMount').innerHTML=renderPassport(rows);const c=confidence(rows),strong=document.querySelector('.confidence-card strong'),meter=document.querySelector('.meter span');strong.textContent=c.score+'/100';meter.style.width=c.score+'%';document.getElementById('confConfirmed').textContent=c.confirmed;document.getElementById('confStated').textContent=c.stated;document.getElementById('confReview').textContent=c.review;document.querySelector('.confidence-card p').textContent=`Evidence-derived score: ${c.confirmed} confirmed, ${c.stated} agent stated, ${c.review} unresolved. This is not a survey, valuation or legal verification.`;const saveBtn=document.getElementById('saveBtn'),note=document.getElementById('saveNote');try{const ids=await window.havenlyData.savedPropertyIds();if(ids?.includes(p.id))saveBtn.textContent='Saved ✓'}catch(e){}saveBtn.onclick=async()=>{saveBtn.disabled=true;try{const user=await window.havenlyData.user();if(!user){location.href='signin.html?return='+encodeURIComponent(location.pathname+location.search);return}const ids=await window.havenlyData.savedPropertyIds()||[];if(ids.includes(p.id)){await window.havenlyData.unsaveProperty(p);saveBtn.textContent='Save property ♡';note.textContent='Removed from your shortlist.'}else{await window.havenlyData.saveProperty(p);saveBtn.textContent='Saved ✓';note.textContent='Saved to your Havenly shortlist.'}}catch(e){console.error(e);note.textContent='Unable to update your shortlist. Please try again.'}finally{saveBtn.disabled=false}};document.getElementById('viewBtn').onclick=()=>location.href=`enquiry.html?id=${p.id}&type=viewing`}render();</script></body></html>
