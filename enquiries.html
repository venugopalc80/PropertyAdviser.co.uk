<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Manage buyer enquiries and viewing requests in the Havenly agent workspace."><title>Enquiries | Havenly</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="components.css"><style>.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:end;flex-wrap:wrap;margin:22px 0}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters select,.filters input{padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff}.enquiry-list{display:grid;gap:12px}.enquiry-row{display:grid;grid-template-columns:1fr auto;gap:18px;border:1px solid var(--line);border-radius:16px;padding:18px;background:#fff}.enquiry-row h3{margin:0 0 6px}.muted{color:#667085;font-size:13px}.pill{display:inline-block;padding:6px 9px;border-radius:999px;background:#eef6f0;color:#315a3c;font-size:11px;font-weight:700}.row-actions{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}.empty,.agent-note{padding:28px;border:1px dashed var(--line);border-radius:16px;background:#fff}.agent-note{border-style:solid;margin-bottom:18px;font-size:13px;color:#667085;line-height:1.5}@media(max-width:700px){.enquiry-row{grid-template-columns:1fr}.row-actions{justify-content:flex-start}}</style></head><body><a class="skip-link" href="#main">Skip to content</a><header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html"><span class="brand-mark">H</span><span>havenly<span class="brand-dot">.</span></span></a><nav class="nav" aria-label="Primary"><a href="properties.html">Buy</a><a href="properties.html?mode=rent">Rent</a><a href="property-intelligence.html">Insights</a><a class="active" href="agent.html">For agents</a></nav><div class="nav-actions"><a class="outline-btn" href="agent.html">Dashboard</a></div></div></header><main id="main" class="section"><div class="container"><p class="eyebrow">AGENT WORKSPACE</p><h1>Buyer enquiries.</h1><p class="section-lead">Review enquiries and viewing requests generated from the buyer journey.</p><div id="authNote" class="agent-note">Checking your Havenly account…</div><div class="toolbar"><div class="filters"><input id="search" placeholder="Search property or buyer" aria-label="Search enquiries"><select id="type" aria-label="Filter enquiry type"><option value="all">All enquiries</option><option value="viewing">Viewing requests</option><option value="other">Other enquiries</option></select><select id="status" aria-label="Filter status"><option value="all">All statuses</option><option value="Requested">Requested</option><option value="new">New</option></select></div><span class="pill" id="count">0 enquiries</span></div><div id="list" class="enquiry-list"><div class="empty">Loading enquiries…</div></div></div></main><footer class="footer"><div class="container footer-bottom"><span>© Havenly demo by The Pixel Muses</span><a href="privacy.html">Privacy</a><a href="cookies.html">Cookies</a><a href="accessibility.html">Accessibility</a></div></footer><script src="data.js"></script><script src="supabase-client.js"></script><script src="supabase-data.js"></script><script>const all=window.HAVENLY_PROPERTIES||[],$=x=>document.getElementById(x),list=$('list'),search=$('search'),type=$('type'),status=$('status');function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function dateText(v){const d=new Date(v);return Number.isNaN(d.getTime())?'':d.toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'})}function render(items){const q=search.value.trim().toLowerCase(),filtered=items.filter(r=>(!q||`${r.property||''} ${r.name||''} ${r.email||''}`.toLowerCase().includes(q))&&(type.value==='all'||(type.value==='viewing'?r.interest==='Arranging a viewing':r.interest!=='Arranging a viewing'))&&(status.value==='all'||r.status===status.value));$('count').textContent=`${filtered.length} ${filtered.length===1?'enquiry':'enquiries'}`;list.innerHTML=filtered.length?filtered.map(r=>{const p=all.find(x=>x.dbId===r.property_id);return `<article class="enquiry-row"><div><h3>${esc(p?.title||'Havenly property')}</h3><div class="muted">${esc(r.name||'Buyer')} · ${esc(r.email||'')}${r.phone?' · '+esc(r.phone):''}</div><p>${esc(r.interest||'Property enquiry')} · ${dateText(r.created_at)}</p><p class="muted">${esc(r.message||'')}</p></div><div class="row-actions"><span class="pill">${esc(r.status||'New')}</span>${p?`<a class="outline-btn" href="property.html?id=${p.id}">Property</a>`:''}</div></article>`}).join(''):'<div class="empty"><h3>No enquiries found</h3><p class="muted">Buyer requests submitted through Havenly will appear here.</p></div>'}async function boot(){const user=await window.havenlyData.user();if(!user){$('authNote').innerHTML='Please sign in to access the agent workspace. <a href="signin.html?return=enquiries.html">Sign in →</a>';list.innerHTML='<div class="empty"><h3>Sign-in required</h3><p class="muted">Agent access is protected by authentication.</p></div>';return}$('authNote').textContent=`Signed in as ${user.email||'your Havenly account'}. Enquiries shown here are loaded from the authenticated buyer activity store.`;try{const [enquiries,viewings]=await Promise.all([window.havenlyData.myEnquiries(),window.havenlyData.myViewings()]);const combined=[...(enquiries||[]),...(viewings||[]).map(v=>({...v,interest:'Arranging a viewing',status:v.status||'Requested'}))];render(combined)}catch(e){console.error(e);list.innerHTML='<div class="empty"><h3>Unable to load requests</h3><p class="muted">Please refresh and try again.</p></div>'}}search.oninput=()=>boot();type.onchange=()=>boot();status.onchange=()=>boot();boot();</script></body></html>
