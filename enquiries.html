<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Manage buyer enquiries and viewing requests in the Havenly agent demo."><title>Enquiries | Havenly</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="components.css"><style>.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:end;flex-wrap:wrap;margin:22px 0}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters select,.filters input{padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff}.enquiry-list{display:grid;gap:12px}.enquiry-row{display:grid;grid-template-columns:1fr auto;gap:18px;border:1px solid var(--line);border-radius:16px;padding:18px;background:#fff}.enquiry-row h3{margin:0 0 6px}.muted{color:#667085;font-size:13px}.pill{display:inline-block;padding:6px 9px;border-radius:999px;background:#eef6f0;color:#315a3c;font-size:11px;font-weight:700}.row-actions{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}.empty{padding:28px;border:1px dashed var(--line);border-radius:16px;background:#fff}@media(max-width:700px){.enquiry-row{grid-template-columns:1fr}.row-actions{justify-content:flex-start}}</style></head><body><a class="skip-link" href="#main">Skip to content</a><header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html"><span class="brand-mark">H</span><span>havenly<span class="brand-dot">.</span></span></a><nav class="nav" aria-label="Primary"><a href="properties.html">Buy</a><a href="properties.html?mode=rent">Rent</a><a href="index.html#insights">Insights</a><a class="active" href="agent.html">For agents</a></nav><div class="nav-actions"><a class="outline-btn" href="agent.html">Dashboard</a></div></div></header><main id="main" class="section"><div class="container"><p class="eyebrow">AGENT WORKSPACE</p><h1>Buyer enquiries.</h1><p class="section-lead">Review demo enquiries and viewing requests generated from the buyer journey.</p><div class="toolbar"><div class="filters"><input id="search" placeholder="Search property or buyer" aria-label="Search enquiries"><select id="type" aria-label="Filter enquiry type"><option value="all">All enquiries</option><option value="viewing">Viewing requests</option><option value="other">Other enquiries</option></select><select id="status" aria-label="Filter status"><option value="all">All statuses</option><option value="Requested">Requested</option><option value="Sent">Sent</option></select></div><span class="pill" id="count">0 enquiries</span></div><div id="list" class="enquiry-list"></div></div></main><footer class="footer"><div class="container footer-bottom"><span>© Havenly demo by The Pixel Muses</span><a href="privacy.html">Privacy</a><a href="cookies.html">Cookies</a><a href="accessibility.html">Accessibility</a></div></footer><script src="data.js"></script><script>const all=window.HAVENLY_PROPERTIES||[];const list=document.getElementById('list');const search=document.getElementById('search'),type=document.getElementById('type'),status=document.getElementById('status');function render(){const q=search.value.trim().toLowerCase();const requests=JSON.parse(localStorage.getItem('havenlyEnquiries')||'[]').slice().reverse().filter(r=>(!q||`${r.property} ${r.name} ${r.email}`.toLowerCase().includes(q))&&(type.value==='all'||(type.value==='viewing'?r.interest==='Arranging a viewing':r.interest!=='Arranging a viewing'))&&(status.value==='all'||r.status===status.value));document.getElementById('count').textContent=`${requests.length} ${requests.length===1?'enquiry':'enquiries'}`;list.innerHTML=requests.length?requests.map(r=>{const p=all.find(x=>x.id===r.propertyId);return `<article class="enquiry-row"><div><h3>${r.property}</h3><div class="muted">${r.name||'Demo buyer'} · ${r.email}${r.phone?' · '+r.phone:''}</div><p>${r.interest} · ${new Date(r.createdAt).toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'})}</p><p class="muted">${r.message}</p></div><div class="row-actions"><span class="pill">${r.status||'Sent'}</span><a class="outline-btn" href="property.html?id=${r.propertyId}">Property</a></div></article>`}).join(''):'<div class="empty"><h3>No enquiries yet</h3><p class="muted">Submit an enquiry or viewing request from a property page to see it here.</p></div>'}search.oninput=render;type.onchange=render;status.onchange=render;render();</script></body></html>
