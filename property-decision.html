<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Havenly property decision view with evidence, confidence and outstanding checks.">
<meta name="theme-color" content="#0b1320"><title>Should I pursue this home? | Havenly">
<link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="components.css">
<style>
.decision-hero{background:#0b1320;color:#fff;padding:64px 0 90px}.decision-hero h1{font:600 clamp(42px,6vw,70px)/1 "Playfair Display",Georgia,serif;letter-spacing:-2px;margin:0 0 14px}.decision-hero em{color:#c9d8ce}.decision-hero p{max-width:700px;color:#b9c2cb;font-size:17px}.decision-wrap{margin-top:-42px;position:relative}.decision-panel{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 20px 70px rgba(11,19,32,.1);padding:28px}.decision-top{display:flex;justify-content:space-between;gap:24px;align-items:flex-start}.decision-top h2{font:600 34px/1.05 "Playfair Display",Georgia,serif;margin:5px 0}.confidence{width:108px;height:108px;border-radius:50%;background:#eef5f0;border:8px solid #d6e7db;display:grid;place-items:center;text-align:center;flex:none}.confidence strong{display:block;font-size:29px;line-height:1}.confidence span{font-size:9px;letter-spacing:1px;color:#687382}.decision-meter{height:9px;background:#e7ece8;border-radius:99px;overflow:hidden;margin:22px 0}.decision-meter span{display:block;height:100%;background:#5f896f;border-radius:99px}.decision-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;margin-top:20px}.decision-card{border:1px solid var(--line);border-radius:18px;padding:22px;background:#fff}.decision-card h3{font:600 24px "Playfair Display",Georgia,serif;margin:0 0 15px}.stat-list{display:grid;gap:0}.stat{display:flex;justify-content:space-between;gap:20px;padding:12px 0;border-top:1px solid var(--line);font-size:13px}.stat strong{font-size:14px}.good{color:#3e7456}.warn{color:#946f21}.neutral{color:#687382}.checks{display:grid;grid-template-columns:1fr 1fr;gap:10px}.check{padding:13px;border:1px solid var(--line);border-radius:12px;font-size:13px}.check.ok:before{content:'✓ ';color:#5f896f;font-weight:800}.check.warn{background:#fffaf0;border-color:#eadfbe}.check.warn:before{content:'! ';color:#946f21;font-weight:800}.check.missing{background:#f5f6f7}.check.missing:before{content:'— ';color:#687382;font-weight:800}.evidence-groups{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}.evidence-group{border:1px solid var(--line);border-radius:14px;padding:16px}.evidence-group b{display:block;font-size:13px;margin-bottom:5px}.evidence-group strong{font-size:23px}.evidence-group span{display:block;color:#687382;font-size:11px;margin-top:4px}.decision-note{padding:14px 16px;background:#f6faf7;border:1px solid #dbe5de;border-radius:12px;color:#52645a;font-size:12px;line-height:1.6;margin-top:18px}.section{padding:72px 0}.section h2{font:600 46px/.98 "Playfair Display",Georgia,serif;margin:0 0 12px}.lead{color:#687382;max-width:680px}.questions{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:28px}.question{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px}.question b{display:block;margin-bottom:7px}.question p{margin:0;color:#687382;font-size:13px}.cta{background:#0b1320;color:#fff;padding:70px 0}.cta-inner{display:flex;justify-content:space-between;gap:30px;align-items:center}.cta h2{font:600 44px/1 "Playfair Display",Georgia,serif;margin:0 0 10px}.cta p{color:#b9c2cb;max-width:620px}.btn-row{display:flex;gap:10px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;padding:13px 18px;border-radius:11px;font-weight:700;border:1px solid transparent}.btn-light{background:#fff;color:#0b1320}.btn-outline{border-color:#ccd3da;background:#fff;color:#0b1320}.disclaimer{font-size:11px;color:#77818c;margin-top:20px}@media(max-width:850px){.decision-grid,.questions,.evidence-groups{grid-template-columns:1fr}.decision-top{display:block}.confidence{margin-top:20px}.cta-inner{display:block}.cta .btn-row{margin-top:24px}}
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html"><span class="brand-mark">H</span><span>havenly<span class="brand-dot">.</span></span></a><nav class="nav" aria-label="Primary"><a href="properties.html">Buy</a><a href="properties.html?mode=rent">Rent</a><a href="property-intelligence.html">Insights</a><a href="agent.html">For agents</a></nav><div class="nav-actions"><a class="ghost-btn" href="account.html">♡ Saved</a><a class="outline-btn" href="signin.html">Sign in</a></div></div></header>
<main id="main">
<section class="decision-hero"><div class="container"><p class="eyebrow light">PROPERTY DECISION VIEW</p><h1>Should you pursue<br><em>this home?</em></h1><p>Move from liking a listing to understanding the decision. Havenly now uses the property's Data Passport to show what is known, what is uncertain and what should be checked next.</p></div></section>
<section class="decision-wrap"><div class="container"><div class="decision-panel" id="decisionPanel"><p>Loading property evidence…</p></div></div></section>
<section class="section"><div class="container"><p class="eyebrow">QUESTIONS WORTH ASKING</p><h2>Turn the unknowns into next steps.</h2><p class="lead">A confidence score should not hide uncertainty. It should tell the buyer exactly what still needs checking.</p><div class="questions"><article class="question"><b>Planning history</b><p>Check relevant planning permissions, applications and completion documents where applicable.</p></article><article class="question"><b>Flood-risk context</b><p>Check the property's actual flood-risk position using an appropriate authoritative source before relying on a listing summary.</p></article><article class="question"><b>Running costs</b><p>Confirm EPC details, heating type, council tax and any service or estate charges that apply.</p></article></div></div></section>
<section class="cta"><div class="container cta-inner"><div><p class="eyebrow light">NEXT STEP</p><h2>Save it, compare it, or ask the agent.</h2><p>The decision view is evidence-led: unresolved material information stays visible instead of being hidden behind a single score.</p></div><div class="btn-row"><a class="btn btn-light" id="saveLink" href="#">Save property</a><a class="btn btn-outline" href="compare.html">Compare homes</a><a class="btn btn-outline" href="property.html" id="detailLink">Back to property</a></div></div></section>
</main>
<footer class="footer"><div class="container footer-bottom"><span>© Havenly demo by The Pixel Muses</span><span>Illustrative demo data. Not a valuation, survey, legal advice or mortgage offer.</span></div></footer>
<script src="data.js"></script><script src="supabase-client.js"></script><script src="supabase-data.js"></script>
<script>
const all=window.HAVENLY_PROPERTIES||[];const id=Number(new URLSearchParams(location.search).get('id'))||1;const p=all.find(x=>x.id===id)||all[0];const panel=document.getElementById('decisionPanel');const money=n=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP',maximumFractionDigits:0}).format(n);const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const groups={core:['price','property_type','bedrooms','bathrooms','floor_area','tenure','epc_rating','council_tax'],costs:['electricity','water','sewerage','heating','broadband','mobile','ground_rent','service_charges'],legal:['rights_easements','restrictions','lease_terms','planning'],risk:['flood_risk','construction','issues','building_safety','coastal_erosion','mining']};
const labels={price:'Price',property_type:'Property type',bedrooms:'Bedrooms',bathrooms:'Bathrooms',floor_area:'Floor area',tenure:'Tenure',epc_rating:'EPC',council_tax:'Council tax',electricity:'Electricity',water:'Water',sewerage:'Sewerage',heating:'Heating',broadband:'Broadband',mobile:'Mobile signal',ground_rent:'Ground rent',service_charges:'Service charges',rights_easements:'Rights & easements',restrictions:'Restrictions',lease_terms:'Lease terms',planning:'Planning',flood_risk:'Flood risk',construction:'Construction',issues:'Property issues',building_safety:'Building safety',coastal_erosion:'Coastal erosion',mining:'Mining'};
const critical=['price','tenure','epc_rating','council_tax','property_type','floor_area','flood_risk','planning','restrictions','issues','building_safety'];
async function loadRows(){try{const c=await window.havenlyData.client();if(c&&p?.dbId){const r=await c.from('property_data_passport').select('field_key,field_label,value_text,status,source_name,source_url,reviewed_at,notes').eq('property_id',p.dbId).order('field_label');if(!r.error&&r.data?.length)return r.data}}catch(e){console.warn('Decision Passport unavailable',e)}return []}
function status(row){return row?.status||'not_provided'}
function groupStats(rows,keys){const subset=rows.filter(r=>keys.includes(r.field_key));const confirmed=subset.filter(r=>status(r)==='confirmed').length;const stated=subset.filter(r=>status(r)==='agent_stated').length;const unresolved=subset.filter(r=>['needs_review','not_provided'].includes(status(r))).length;return {total:subset.length,confirmed,stated,unresolved}}
function render(rows){const result=window.havenlyData.propertyConfidence(rows);const map=new Map(rows.map(r=>[r.field_key,r]));const unresolvedCritical=critical.filter(k=>{const r=map.get(k);return !r||['needs_review','not_provided'].includes(status(r))});const ready=unresolvedCritical.length===0;const title=esc(p.title),loc=esc(p.location);const groupNames=[['Core facts',groups.core],['Costs & utilities',groups.costs],['Legal & title',groups.legal],['Risk & condition',groups.risk]];const cards=groupNames.map(([name,keys])=>{const s=groupStats(rows,keys);return `<div class="evidence-group"><b>${name}</b><strong>${s.confirmed+s.stated}/${s.total||0}</strong><span>${s.confirmed} confirmed · ${s.stated} agent stated · ${s.unresolved} unresolved</span></div>`}).join('');const checks=critical.map(k=>{const r=map.get(k);const s=status(r);const value=r?.value_text||'Not provided';if(s==='confirmed')return `<div class="check ok">${esc(labels[k])}: ${esc(value)}</div>`;if(s==='agent_stated')return `<div class="check warn">${esc(labels[k])}: ${esc(value)} · agent stated</div>`;return `<div class="check missing">${esc(labels[k])}: ${esc(value)}</div>`}).join('');const missingText=unresolvedCritical.length?`${unresolvedCritical.length} decision-critical item${unresolvedCritical.length===1?'':'s'} still need evidence or review.`:'No decision-critical Passport gaps are currently flagged.';panel.innerHTML=`<div class="decision-top"><div><p class="eyebrow">DECISION SNAPSHOT</p><h2>${title}</h2><div class="muted">${loc} · ${p.beds} bedrooms · ${p.baths} bathrooms · ${esc(p.area)}</div></div><div class="confidence"><div><strong>${result.score}</strong><span>CONFIDENCE</span></div></div></div><div class="decision-meter"><span style="width:${result.score}%"></span></div><div class="decision-grid"><article class="decision-card"><h3>What does the evidence say?</h3><div class="stat-list"><div class="stat"><span>Asking price</span><strong>${money(p.price)}</strong></div><div class="stat"><span>Passport coverage</span><strong>${result.confirmed+result.stated}/${result.totalFields} fields supplied</strong></div><div class="stat"><span>Source-confirmed</span><strong class="good">${result.confirmed}</strong></div><div class="stat"><span>Agent-stated</span><strong class="neutral">${result.stated}</strong></div><div class="stat"><span>Needs review / missing</span><strong class="warn">${result.review}</strong></div><div class="stat"><span>Decision status</span><strong class="${ready?'good':'warn'}">${ready?'Evidence-ready':'Checks outstanding'}</strong></div></div><div class="decision-note"><strong>${missingText}</strong> ${ready?'The current Passport supports progressing to the next buyer step, subject to normal professional checks.':'Do not interpret the score as a valuation or legal clearance; use the outstanding items to guide questions and due diligence.'}</div></article><article class="decision-card"><h3>Decision-critical checks</h3><div class="checks">${checks}</div></article></div><div class="evidence-groups">${cards}</div><p class="disclaimer">Confidence is calculated from the property's Passport evidence status and is a product signal, not a survey, valuation, legal verification, mortgage assessment or guarantee of transaction success.</p>`}
async function init(){if(!p){panel.innerHTML='<h2>Property not found</h2><p>The property requested is not available.</p>';return}document.title=`Should you pursue ${p.title}? | Havenly`;document.getElementById('detailLink').href=`property.html?id=${p.id}`;const rows=await loadRows();render(rows);const save=document.getElementById('saveLink');save.onclick=async e=>{e.preventDefault();try{const user=await window.havenlyData.user();if(!user){location.href='signin.html?return='+encodeURIComponent(location.pathname+location.search);return}const ids=await window.havenlyData.savedPropertyIds()||[];if(ids.includes(p.id)){await window.havenlyData.unsaveProperty(p);save.textContent='Save property'}else{await window.havenlyData.saveProperty(p);save.textContent='Saved ✓'}}catch(err){console.error(err);save.textContent='Unable to save'}}}
init();
</script>
</body></html>
