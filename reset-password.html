<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Reset your Havenly account password."><meta name="theme-color" content="#0b1320">
  <title>Reset password | Havenly</title>
  <link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="components.css">
  <style>
    .auth-shell{min-height:calc(100vh - 84px);display:grid;place-items:center;background:#f7f8fa;padding:40px 18px}.auth-card{width:min(100%,480px);background:#fff;border:1px solid #e5e7eb;border-radius:24px;padding:42px;box-shadow:0 24px 70px rgba(11,19,32,.08)}.auth-card h1{font-family:'Playfair Display',Georgia,serif;font-size:42px;line-height:1.05;margin:8px 0 12px;color:#0b1320}.auth-lead{color:#64748b;line-height:1.65;margin:0 0 28px}.auth-form{display:grid;gap:18px}.auth-field{display:grid;gap:8px}.auth-field label{font-size:13px;font-weight:700;color:#334155}.auth-field input{width:100%;box-sizing:border-box;border:1px solid #d7dde5;border-radius:12px;padding:14px 15px;font:inherit}.auth-submit{width:100%;border:0;border-radius:12px;background:#0b1320;color:#fff;padding:15px 18px;font:700 15px 'DM Sans',sans-serif;cursor:pointer}.auth-submit:disabled{opacity:.65}.auth-message{display:none;margin-top:16px;padding:12px 14px;border-radius:10px;background:#eef6f0;color:#315a3c;font-size:13px;line-height:1.5}.auth-message.show{display:block}.auth-message.error{background:#fff1f2;color:#9f1239}.auth-foot{margin:24px 0 0;text-align:center;font-size:13px;color:#64748b}.auth-link{color:#0b1320;text-decoration:underline;font-weight:700}
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html" aria-label="Havenly home"><span class="brand-mark">H</span><span>havenly<span class="brand-dot">.</span></span></a></div></header>
  <main id="main" class="auth-shell"><section class="auth-card"><p class="eyebrow">ACCOUNT SECURITY</p><h1>Choose a new password.</h1><p class="auth-lead">Set a new password for your Havenly account.</p><form class="auth-form" id="resetForm"><div class="auth-field"><label for="password">New password</label><input id="password" type="password" minlength="6" autocomplete="new-password" required placeholder="At least 6 characters"></div><div class="auth-field"><label for="confirm">Confirm password</label><input id="confirm" type="password" minlength="6" autocomplete="new-password" required placeholder="Repeat your password"></div><button class="auth-submit" id="submitBtn" type="submit">Update password <span>→</span></button></form><div class="auth-message" id="message" role="status" aria-live="polite"></div><p class="auth-foot"><a class="auth-link" href="signin.html">Back to sign in</a></p></section></main>
  <script src="supabase-client.js"></script>
  <script>
    const form=document.getElementById('resetForm'),message=document.getElementById('message'),submit=document.getElementById('submitBtn');
    function show(text,error=false){message.textContent=text;message.className='auth-message show'+(error?' error':'')}
    form.addEventListener('submit',async e=>{e.preventDefault();const password=document.getElementById('password').value,confirm=document.getElementById('confirm').value;if(password!==confirm){show('Passwords do not match.',true);return}submit.disabled=true;show('Updating your password…');try{const client=await window.havenlySupabaseReady;if(!client)throw new Error('Supabase is not configured on this deployment.');const {error}=await client.auth.updateUser({password});if(error)throw error;show('Password updated successfully. You can now sign in.');setTimeout(()=>location.href='signin.html',900)}catch(err){show(err?.message||'Unable to update your password.',true)}finally{submit.disabled=false}});
  </script>
</body>
</html>
