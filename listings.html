<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Manage property listing drafts and publication status in the Havenly agent demo."><title>Listings | Havenly</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="components.css"><style>.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:end;flex-wrap:wrap;margin:24px 0}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters select,.filters input{padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff}.listing-list{display:grid;gap:12px}.listing-row{display:grid;grid-template-columns:110px 1fr auto;gap:16px;align-items:center;border:1px solid var(--line);border-radius:16px;background:#fff;padding:14px}.listing-row img{width:110px;height:88px;object-fit:cover;border-radius:10px}.listing-row h3{margin:0 0 5px}.meta{color:#667085;font-size:13px}.pill{display:inline-block;padding:6px 9px;border-radius:999px;background:#eef6f0;color:#315a3c;font-size:11px;font-weight:700}.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}.empty{padding:28px;border:1px dashed var(--line);border-radius:16px;background:#fff}@media(max-width:720px){.listing-row{grid-template-columns:1fr}.listing-row img{width:100%;height:170px}.actions{justify-content:flex-start}}</style></head><body><a class="skip-link" href="#main">Skip to content</a><header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html"><span class="brand-mark">H</span><span>havenly<span class="brand-dot">.</span></span></a><nav class="nav" aria-label="Primary"><a href="properties.html">Buy</a><a href="properties.html?mode=rent">Rent</a><a href="index.html#insights">Insights</a><a class="active" href="agent.html">For agents</a></nav><div class="nav-actions"><a class="outline-btn" href="agent.html">Dashboard</a></div></div></header><main id="main" class="section"><div class="container"><p class="eyebrow">AGENT WORKSPACE</p><h1>Listing management.</h1><p class="section-lead">Manage demo drafts and publication status from one place.</p><div class="toolbar"><div class="filters"><input id="search" placeholder="Search listings" aria-label="Search listings"><select id="status" aria-label="Filter listing status"><option value="all">All statuses</option><option value="Draft">Draft</option><option value="Published">Published</option><option value="Unpublished">Unpublished</option></select></div><a class="dark-btn" href="listing.html">+ Add property</a></div><div id="list" class="listing-list"></div></div></main><footer class="footer"><div class="container footer-bottom"><span>© Havenly demo by The Pixel Muses</span><a href="privacy.html">Privacy</a><a href="cookies.html">Cookies</a><a href="accessibility.html">Accessibility</a></div></footer><script src="data.js"></script><script>const key='havenlyAgentListings';const all=window.HAVENLY_PROPERTIES||[];const list=document.getElementById('list'),search=document.getElementById('search'),status=document.getElementById('status');function read(){return JSON.parse(localStorage.getItem(key)||'[]')}function write(v){localStorage.setItem(key,JSON.stringify(v))}function normalise(){let items=read();const draft=JSON.parse(localStorage.getItem('havenlyListingDraft')||'null');if(draft&&!items.some(x=>x.source==='draft')){items.push({id:'draft-1',source:'draft',title:draft.title||'Untitled listing',location:draft.location||'Location not supplied',price:Number(draft.price)||0,beds:Number(draft.beds)||0,area:draft.area||'',epc:draft.epc||'',status:draft.status||'Draft',updatedAt:draft.savedAt||new Date().toISOString()});write(items)}return items}function render(){const q=search.value.trim().toLowerCase();const s=status.value;const items=normalise().filter(x=>(!q||`${x.title} ${x.location}`.toLowerCase().includes(q))&&(s==='all'||x.status===s));document.getElementById('list').innerHTML=items.length?items.map(x=>{const p=all.find(y=>y.id===x.propertyId||y.id===Number(x.propertyId));return `<article class="listing-row"><img src="${p?.image||'https://images.unsplash.com/photo-1564013799919-ab600027ffc6?auto=format&fit=crop&w=500&q=80'}" alt="${x.title}" loading="lazy"><div><h3>${x.title}</h3><div class="meta">${x.location} · ${x.price?'£'+x.price.toLocaleString('en-GB'):'Price not set'} · ${x.beds||0} beds</div><p><span class="pill">${x.status}</span> <span class="meta">Updated ${new Date(x.updatedAt||Date.now()).toLocaleDateString('en-GB')}</span></p></div><div class="actions"><a class="outline-btn" href="listing.html">Edit</a>${x.status==='Published'?`<button class="outline-btn" type="button" data-toggle="${x.id}">Unpublish</button>`:`<button class="dark-btn" type="button" data-toggle="${x.id}">Publish</button>`}<button class="outline-btn" type="button" data-delete="${x.id}">Delete</button></div></article>`}).join(''):'<div class="empty"><h3>No listings found</h3><p class="meta">Create a listing draft to start managing your inventory.</p><a class="dark-btn" href="listing.html">Create listing →</a></div>';document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{let items=read();const i=items.findIndex(x=>String(x.id)===String(b.dataset.toggle));if(i<0)return;items[i].status=items[i].status==='Published'?'Unpublished':'Published';items[i].updatedAt=new Date().toISOString();write(items);render()});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(!confirm('Delete this demo listing?'))return;write(read().filter(x=>String(x.id)!==String(b.dataset.delete)));render()})}search.oninput=render;status.onchange=render;render();</script></body></html>
